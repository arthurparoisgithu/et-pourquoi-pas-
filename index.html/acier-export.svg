<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="ti de">
<title id="ti">L'acier du World Trade Center exporté vers les aciéries d'Asie</title>
<desc id="de">Un cargo chargé de poutres d'acier quitte le port de New York ; des routes maritimes en pointillés filent vers la Chine, l'Inde, la Corée et le Japon.</desc>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#0a0810"/>
    <stop offset="0.42" stop-color="#20162a"/>
    <stop offset="0.72" stop-color="#6b4119"/>
    <stop offset="0.90" stop-color="#c8872b"/>
    <stop offset="1"    stop-color="#f6cf6a"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#6a4720"/>
    <stop offset="0.14" stop-color="#2a2130"/>
    <stop offset="0.6"  stop-color="#17141f"/>
    <stop offset="1"    stop-color="#100e16"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#f6cf6a"/>
    <stop offset="0.45" stop-color="#c9922a"/>
    <stop offset="1"    stop-color="#6a4c18"/>
  </linearGradient>
  <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0"    stop-color="#5b5270"/>
    <stop offset="0.25" stop-color="#37304a"/>
    <stop offset="1"    stop-color="#191527"/>
  </linearGradient>
  <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0"   stop-color="#c9922a" stop-opacity="0"/>
    <stop offset="0.3" stop-color="#e5ac3e" stop-opacity="0.9"/>
    <stop offset="1"   stop-color="#f6cf6a" stop-opacity="1"/>
  </linearGradient>
  <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f6cf6a" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#f6cf6a" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0"   stop-color="#f6cf6a" stop-opacity="0.5"/>
    <stop offset="0.5" stop-color="#e5ac3e" stop-opacity="0.16"/>
    <stop offset="1"   stop-color="#e5ac3e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vig" cx="0.5" cy="0.48" r="0.78">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1"    stop-color="#000" stop-opacity="0.5"/>
  </radialGradient>
  <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2.6"/></filter>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="9"/></filter>
</defs>

<!-- SKY -->
<rect width="900" height="300" fill="url(#sky)"/>
<circle cx="694" cy="300" r="132" fill="url(#halo)"/>
<circle cx="694" cy="296" r="30" fill="#fbe29b" opacity="0.8" filter="url(#soft)"/>

<!-- MANHATTAN SKYLINE -->
<g fill="#0a0810" opacity="0.97">
  <path d="M0 300 V248 h24 v-26 h13 v26 h18 v-48 h9 v-26 h7 v26 h10 v48 h16 v-36 h20 v36 h15 v-78 h11 v-28 h7 v28 h11 v78 h18 v-46 h22 v46 h16 v-30 h19 v30 h20 v-64 h8 v-20 h6 v20 h9 v64 h22 v-24 h24 v24 h19 v-40 h15 v40 h20 v-26 h22 v26 H0 Z"/>
</g>
<g fill="#f6cf6a" opacity="0.5">
  <rect x="82" y="238" width="3" height="4"/><rect x="128" y="262" width="3" height="4"/>
  <rect x="196" y="214" width="3" height="4"/><rect x="208" y="248" width="3" height="4"/>
  <rect x="258" y="270" width="3" height="4"/><rect x="318" y="252" width="3" height="4"/>
  <rect x="344" y="222" width="3" height="4"/><rect x="404" y="284" width="3" height="4"/>
</g>

<!-- SEA -->
<rect y="300" width="900" height="240" fill="url(#sea)"/>
<rect x="672" y="300" width="44" height="130" fill="url(#reflect)"/>
<g stroke="#e5ac3e" stroke-linecap="round" opacity="0.2" fill="none">
  <path d="M36 326 h88" stroke-width="1.2"/><path d="M164 338 h58" stroke-width="1"/>
  <path d="M770 328 h96" stroke-width="1.2"/><path d="M60 506 h132" stroke-width="1.2"/>
  <path d="M296 522 h108" stroke-width="1"/><path d="M782 492 h78" stroke-width="1"/>
</g>

<!-- SHIPPING ROUTES -->
<g fill="none" stroke="url(#route)" stroke-linecap="round">
  <path d="M676 398 C 742 384, 800 368, 900 344" stroke-width="2.4" stroke-dasharray="15 12"/>
  <path d="M676 406 C 756 408, 812 408, 900 404" stroke-width="2"   stroke-dasharray="11 10" opacity="0.82"/>
  <path d="M676 414 C 744 424, 808 434, 900 446" stroke-width="1.7" stroke-dasharray="8 9"   opacity="0.62"/>
</g>
<g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace" font-size="14" letter-spacing="3" fill="#f6cf6a">
  <text x="796" y="330" opacity="0.95">CHINE</text>
  <text x="802" y="392" opacity="0.85">INDE</text>
</g>
<g fill="#f6cf6a">
  <circle cx="782" cy="325" r="2.8" opacity="0.95" filter="url(#glow)"/>
  <circle cx="788" cy="385" r="2.4" opacity="0.8"  filter="url(#glow)"/>
</g>

<!-- CARGO SHIP -->
<g>
  <g stroke="#0a0910" stroke-width="2" fill="url(#beam)">
    <g transform="translate(140 384)">
      <path d="M0 0h48v8H30v16h18v8H0v-8h18V8H0Z"/><path d="M58 0h48v8H88v16h18v8H58v-8h18V8H58Z"/>
      <path d="M116 0h48v8h-18v16h18v8h-48v-8h18V8h-18Z"/><path d="M174 0h48v8h-18v16h18v8h-48v-8h18V8h-18Z"/>
      <path d="M232 0h48v8h-18v16h18v8h-48v-8h18V8h-18Z"/>
    </g>
    <g transform="translate(169 352)" opacity="0.96">
      <path d="M0 0h48v8H30v16h18v8H0v-8h18V8H0Z"/><path d="M58 0h48v8H88v16h18v8H58v-8h18V8H58Z"/>
      <path d="M116 0h48v8h-18v16h18v8h-48v-8h18V8h-18Z"/><path d="M174 0h48v8h-18v16h18v8h-48v-8h18V8h-18Z"/>
    </g>
    <g transform="translate(198 320)" opacity="0.9">
      <path d="M0 0h48v8H30v16h18v8H0v-8h18V8H0Z"/><path d="M58 0h48v8H88v16h18v8H58v-8h18V8H58Z"/>
      <path d="M116 0h48v8h-18v16h18v8h-48v-8h18V8h-18Z"/>
    </g>
  </g>
  <g stroke="#0a0910" stroke-width="3" opacity="0.45">
    <path d="M184 316 v106"/><path d="M312 316 v106"/>
  </g>

  <!-- superstructure -->
  <rect x="494" y="362" width="92" height="60" fill="#2a2438" stroke="#0a0910" stroke-width="2.5"/>
  <rect x="510" y="338" width="60" height="26" fill="#3b3450" stroke="#0a0910" stroke-width="2.5"/>
  <rect x="534" y="296" width="10" height="42" fill="#2a2438"/>
  <circle cx="539" cy="292" r="4" fill="#f6cf6a" filter="url(#glow)"/>
  <g fill="#f6cf6a">
    <rect x="517" y="345" width="10" height="8" opacity="0.92"/><rect x="533" y="345" width="10" height="8" opacity="0.92"/>
    <rect x="549" y="345" width="10" height="8" opacity="0.92"/>
    <rect x="504" y="378" width="9" height="7" opacity="0.6"/><rect x="521" y="378" width="9" height="7" opacity="0.6"/>
    <rect x="558" y="398" width="9" height="7" opacity="0.5"/>
  </g>

  <!-- hull -->
  <path d="M104 422 h506 l-28 56 c-6 11 -17 18 -30 18 H156 c-15 0 -28 -9 -33 -23 Z"
        fill="url(#hull)" stroke="#0a0910" stroke-width="2.5"/>
  <path d="M112 428 h490 l-7 13 H116 Z" fill="#e5ac3e" opacity="0.75"/>
  <g fill="#f6cf6a" opacity="0.4">
    <rect x="160" y="452" width="12" height="6"/><rect x="196" y="452" width="12" height="6"/>
    <rect x="232" y="452" width="12" height="6"/><rect x="268" y="452" width="12" height="6"/>
    <rect x="304" y="452" width="12" height="6"/><rect x="340" y="452" width="12" height="6"/>
  </g>
  <path d="M130 487 h438" stroke="#f6cf6a" stroke-width="3" opacity="0.5" fill="none" stroke-linecap="round"/>
  <path d="M98 428 c-22 8 -33 21 -25 32 l36 -13 Z" fill="#e5ac3e" opacity="0.18" filter="url(#soft)"/>
  <path d="M126 498 h432 l-30 30 H156 Z" fill="#c9922a" opacity="0.2" filter="url(#soft)"/>
  <g stroke="#f6cf6a" stroke-linecap="round" opacity="0.3" fill="none">
    <path d="M176 510 h80" stroke-width="1.6"/><path d="M300 520 h104" stroke-width="1.4"/>
    <path d="M444 508 h66" stroke-width="1.3"/>
  </g>
</g>

<!-- CAPTION -->
<g font-family="ui-monospace, 'JetBrains Mono', Menlo, monospace">
  <line x1="54" y1="62" x2="54" y2="122" stroke="#f0c050" stroke-width="2.5"/>
  <text x="76" y="92" font-size="31" letter-spacing="1.5" fill="#fbe29b">300 000 T</text>
  <text x="78" y="117" font-size="12.5" letter-spacing="3.4" fill="#ded5c6" opacity="0.85">D'ACIER EXPORTÉ · 2001–2002</text>
</g>

<rect width="900" height="540" fill="url(#vig)"/>
</svg>
